services:
  - type: web
    name: miniconnect-3d
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
        placeholder: "Optional: Your MongoDB Atlas Connection URI. If left blank, the app runs in dynamic in-memory sandbox mode!"
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Optional: Your Gemini API Key for generating AI captions"
