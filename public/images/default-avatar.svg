<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a1fa2" />
      <stop offset="100%" stop-color="#00bcd4" />
    </linearGradient>
    <!-- Border Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Glass Card style circle -->
  <circle cx="50" cy="50" r="48" fill="url(#neonGrad)" opacity="0.15" stroke="url(#neonGrad)" stroke-width="2" filter="url(#neonGlow)" />
  <!-- Profile Icon Graphic -->
  <circle cx="50" cy="40" r="16" fill="url(#neonGrad)" />
  <path d="M50,62 C32,62 24,72 24,80 C24,81 25,82 26,82 L74,82 C75,82 76,81 76,80 C76,72 68,62 50,62 Z" fill="url(#neonGrad)" />
</svg>
